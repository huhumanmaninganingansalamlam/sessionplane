name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Verify tag matches package version
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Verify release commit is current main
        run: |
          git fetch origin main --no-tags
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - name: Test
        shell: bash
        run: |
          set +e
          npm run test:ci 2>&1 | tee "$RUNNER_TEMP/sessionplane-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 40 "$RUNNER_TEMP/sessionplane-test.log" | tr '\n' ' ')"
            echo "::error title=npm test failed::$message"
            exit "$status"
          fi
      - run: npm run build
      - run: npm run doctor
        env:
          SESSIONPLANE_STATE_DIR: ${{ runner.temp }}/sessionplane-doctor-state
      - run: npm run test:package
      - id: pack
        name: Build release package
        run: |
          package="$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/repro-pack"
          repro_package="$(npm pack --silent --pack-destination "$RUNNER_TEMP/repro-pack")"
          cmp "$package" "$RUNNER_TEMP/repro-pack/$repro_package"
          sha256sum "$package" > "$package.sha256"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: Smoke test release package
        env:
          PACKAGE: ${{ steps.pack.outputs.package }}
        run: |
          prefix="$RUNNER_TEMP/sessionplane-release-install"
          npm install -g --prefix "$prefix" "./$PACKAGE"
          test -x "$prefix/bin/sessplane"
          "$prefix/bin/sessplane" --help >/dev/null
          SESSIONPLANE_STATE_DIR="$RUNNER_TEMP/sessionplane-release-state" \
            "$prefix/bin/sessplane" doctor --json >/dev/null
      - name: Stage verified release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sessionplane-release-payload-${{ github.sha }}
          path: |
            ${{ steps.pack.outputs.package }}
            ${{ steps.pack.outputs.package }}.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sessionplane-release-payload-${{ github.sha }}
          path: ${{ runner.temp }}/release-payload
      - id: payload
        name: Verify downloaded release payload
        shell: bash
        run: |
          set -euo pipefail
          package="$(find "$RUNNER_TEMP/release-payload" -maxdepth 1 -type f -name 'sessionplane-*.tgz' -print -quit)"
          test -n "$package"
          checksum="$package.sha256"
          test -f "$checksum"
          (
            cd "$(dirname "$package")"
            sha256sum -c "$(basename "$checksum")"
          )
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Attest release package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.payload.outputs.package }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE: ${{ steps.payload.outputs.package }}
          CHECKSUM: ${{ steps.payload.outputs.checksum }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$PACKAGE" "$CHECKSUM" \
            --verify-tag \
            --generate-notes \
            --title "SessionPlane $GITHUB_REF_NAME"
