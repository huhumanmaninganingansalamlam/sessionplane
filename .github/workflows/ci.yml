name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/sessionplane-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 40 "$RUNNER_TEMP/sessionplane-test.log" | tr '\n' ' ')"
            echo "::error title=npm test failed::$message"
            exit "$status"
          fi
      - run: npm run build
      - run: npm run doctor
        env:
          SESSIONPLANE_STATE_DIR: ${{ runner.temp }}/sessionplane-doctor-state
      - run: npm run test:package
