name: 기능 제안
description: 해결할 문제와 원하는 사용자 결과를 제안합니다.
labels: ["type/feature", "status/triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      description: 누가 어떤 상황에서 무엇 때문에 불편한지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과와 사용 예시
      description: 구현 방법보다 사용자 흐름이 어떻게 달라지는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 현재 우회 방법과 제약
      description: 알고 있는 내용만 적어 주세요.
