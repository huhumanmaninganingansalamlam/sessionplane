name: 작업
description: 구체적인 구현·조사·정리 작업을 제안합니다.
labels: ["type/task", "status/triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표와 범위
      description: 필요한 이유, 포함할 것과 제외할 것을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 확인 가능한 완료 조건
      description: 코드 작성·테스트 완료보다 사용자에게 관찰되는 결과를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 확인 방법과 참고 자료
      description: 관련 이슈나 재현 방법·참고 파일을 적어 주세요.
